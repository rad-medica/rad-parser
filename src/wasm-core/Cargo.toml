[package]
name = "rad-parser-wasm-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
# flate2/crc32fast removed (moved to codecs)
byteorder = "1.4"
image = { version = "0.24", default-features = false }
# Removed: jpeg-decoder, hayro-jpeg2000, charls

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

